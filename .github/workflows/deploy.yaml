name: Build and Deploy

on:
  push:
    branches: [main, dev]

env:
  REGISTRY: registry.mobatix.de
  FRONTEND_IMAGE: registry.mobatix.de/fliegengitter-shop
  BACKEND_IMAGE: registry.mobatix.de/medusa-backend
  K8S_NAMESPACE: diefliegengitterprofis

jobs:
  build-and-deploy:
    runs-on: arc-runner-set
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment variables
        id: env
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            echo "ENV=prod" >> $GITHUB_OUTPUT
            echo "VALUES_FILE=helm/fliegengitter/values-prod.yaml" >> $GITHUB_OUTPUT
            echo "MEDUSA_BACKEND_URL=https://admin.diefliegengitterprofis.de" >> $GITHUB_OUTPUT
            echo "MEDUSA_PUBLISHABLE_KEY=${MEDUSA_PK_PROD}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=fliegengitter-prod" >> $GITHUB_OUTPUT
          else
            echo "ENV=dev" >> $GITHUB_OUTPUT
            echo "VALUES_FILE=helm/fliegengitter/values-dev.yaml" >> $GITHUB_OUTPUT
            echo "MEDUSA_BACKEND_URL=https://admin.dfp.mobatix.de" >> $GITHUB_OUTPUT
            echo "MEDUSA_PUBLISHABLE_KEY=${MEDUSA_PK_DEV}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=fliegengitter-dev" >> $GITHUB_OUTPUT
          fi

      - name: Calculate next version tag
        id: tag
        run: |
          AUTH=$(echo -n "admin:${REGISTRY_PASSWORD}" | base64)

          LATEST=$(curl -s -H "Authorization: Basic ${AUTH}" \
            "https://${REGISTRY}/v2/fliegengitter-shop/tags/list" \
            | jq -r '.tags[]?' 2>/dev/null | grep '^v' | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            NEXT="v2.2.2"
          else
            MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3)

            PATCH=$((PATCH + 1))
            if [ "$PATCH" -gt 50 ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            fi
            NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "TAG=${NEXT}" >> $GITHUB_OUTPUT
          echo "Next version: ${NEXT}"

      - name: Install kubectl and helm
        run: |
          mkdir -p $HOME/.local/bin

          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          mv kubectl $HOME/.local/bin/

          curl -fsSL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz | tar xz
          mv linux-amd64/helm $HOME/.local/bin/
          chmod +x $HOME/.local/bin/helm
          rm -rf linux-amd64

          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/kubectl version --client
          $HOME/.local/bin/helm version

      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 30); do
            docker info > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Docker login
        run: echo "${REGISTRY_PASSWORD}" | docker login registry.mobatix.de -u admin --password-stdin

      - name: Build frontend image
        run: |
          ENV="${{ steps.env.outputs.ENV }}"
          TAG="${{ steps.tag.outputs.TAG }}"
          docker build \
            --build-arg NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ steps.env.outputs.MEDUSA_BACKEND_URL }} \
            --build-arg NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ steps.env.outputs.MEDUSA_PUBLISHABLE_KEY }} \
            -t ${{ env.FRONTEND_IMAGE }}:${TAG}-${ENV} \
            -f Dockerfile .

      - name: Build backend image
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${TAG} \
            -f backend/Dockerfile backend/

      - name: Push images
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"
          ENV="${{ steps.env.outputs.ENV }}"
          docker push ${{ env.FRONTEND_IMAGE }}:${TAG}-${ENV}
          docker push ${{ env.BACKEND_IMAGE }}:${TAG}

      - name: Docker cleanup (keep build cache)
        run: docker image prune -af 2>/dev/null || true

      - name: Deploy with Helm
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"
          ENV="${{ steps.env.outputs.ENV }}"
          RELEASE="${{ steps.env.outputs.RELEASE_NAME }}"
          VALUES="${{ steps.env.outputs.VALUES_FILE }}"

          helm upgrade --install "${RELEASE}" ./helm/fliegengitter \
            -n ${{ env.K8S_NAMESPACE }} --create-namespace \
            -f "${VALUES}" \
            --set frontend.image.tag="${TAG}-${ENV}" \
            --set backend.image.tag="${TAG}" \
            --wait \
            --timeout 5m

      - name: Cleanup old registry tags (keep latest 10)
        if: success()
        continue-on-error: true
        run: |
          AUTH=$(echo -n "admin:${REGISTRY_PASSWORD}" | base64)
          REG="https://${REGISTRY}"

          cleanup_repo() {
            REPO=$1
            echo "Cleaning up $REPO..."

            TAGS=$(curl -s -H "Authorization: Basic ${AUTH}" \
              "${REG}/v2/${REPO}/tags/list" \
              | jq -r '.tags[]?' 2>/dev/null | grep '^v' | sort -V)

            COUNT=$(echo "$TAGS" | grep -c .)
            if [ "$COUNT" -le 10 ]; then
              echo "  Only $COUNT tags, nothing to clean"
              return
            fi

            DELETE_TAGS=$(echo "$TAGS" | head -n -10)
            for T in $DELETE_TAGS; do
              DIGEST=$(curl -s -I -H "Authorization: Basic ${AUTH}" \
                -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
                "${REG}/v2/${REPO}/manifests/${T}" \
                | grep -i docker-content-digest | awk '{print $2}' | tr -d '\r')

              if [ -n "$DIGEST" ]; then
                curl -s -X DELETE -H "Authorization: Basic ${AUTH}" \
                  "${REG}/v2/${REPO}/manifests/${DIGEST}"
                echo "  Deleted $T ($DIGEST)"
              fi
            done
          }

          cleanup_repo "fliegengitter-shop"
          cleanup_repo "medusa-backend"

      - name: Deployment status
        if: always()
        run: |
          echo "=== Deployed ${{ steps.env.outputs.ENV }}: ${{ steps.tag.outputs.TAG }} ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} 2>/dev/null || echo "kubectl not available"
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }} 2>/dev/null || true
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }} 2>/dev/null || true
