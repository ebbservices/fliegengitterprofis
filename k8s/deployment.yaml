apiVersion: apps/v1
kind: Deployment
metadata:
  name: fliegengitter-shop
  labels:
    app: fliegengitter-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fliegengitter-shop
  template:
    metadata:
      labels:
        app: fliegengitter-shop
    spec:
      containers:
      - name: fliegengitter-shop
        image: registry.mobatix.de/fliegengitter-shop:v2.1.4
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      imagePullSecrets:
      - name: registry-secret
---
apiVersion: v1
kind: Service
metadata:
  name: fliegengitter-shop
spec:
  selector:
    app: fliegengitter-shop
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fliegengitter-shop-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-rpm: "300"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - dev.diefliegengitterprofis.mobatix.de
    secretName: fliegengitter-shop-tls
  rules:
  - host: dev.diefliegengitterprofis.mobatix.de
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fliegengitter-shop
            port:
              number: 80















