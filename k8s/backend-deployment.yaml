apiVersion: apps/v1
kind: Deployment
metadata:
  name: medusa-backend
  labels:
    app: medusa-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medusa-backend
  template:
    metadata:
      labels:
        app: medusa-backend
    spec:
      initContainers:
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "chown -R 1001:1001 /app/static"]
        volumeMounts:
        - name: uploads
          mountPath: /app/static
      containers:
      - name: medusa-backend
        image: registry.mobatix.de/medusa-backend:v2.2.1
        ports:
        - containerPort: 9000
        envFrom:
        - secretRef:
            name: medusa-secrets
        env:
        - name: NODE_ENV
          value: "production"
        - name: STORE_CORS
          value: "https://dev.diefliegengitterprofis.mobatix.de"
        - name: ADMIN_CORS
          value: "https://admin.diefliegengitterprofis.mobatix.de"
        - name: AUTH_CORS
          value: "https://dev.diefliegengitterprofis.mobatix.de,https://admin.diefliegengitterprofis.mobatix.de"
        - name: BACKEND_PUBLIC_URL
          value: "https://admin.diefliegengitterprofis.mobatix.de"
        volumeMounts:
        - name: uploads
          mountPath: /app/static
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 45
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: medusa-uploads-pvc
      imagePullSecrets:
      - name: registry-secret
---
apiVersion: v1
kind: Service
metadata:
  name: medusa-backend
spec:
  selector:
    app: medusa-backend
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medusa-backend-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-rpm: "300"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - admin.diefliegengitterprofis.mobatix.de
    secretName: medusa-backend-tls
  rules:
  - host: admin.diefliegengitterprofis.mobatix.de
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: medusa-backend
            port:
              number: 9000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medusa-uploads-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi














