#     --from-literal=REDIS_URL='redis://:pass@redis:6379/0' \
#     --from-literal=JWT_SECRET='$(openssl rand -base64 64)' \
#     --from-literal=COOKIE_SECRET='$(openssl rand -base64 64)' \
