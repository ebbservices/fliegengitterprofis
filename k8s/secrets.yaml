# Kubernetes Secrets Template
# WICHTIG: Diese Datei enthält NUR Platzhalter.
# Echte Secrets werden manuell oder via CI/CD gesetzt.
#
# Secrets erstellen:
#   kubectl create secret generic medusa-secrets \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/db' \
#     --from-literal=REDIS_URL='redis://:pass@redis:6379/0' \
#     --from-literal=JWT_SECRET='$(openssl rand -base64 64)' \
#     --from-literal=COOKIE_SECRET='$(openssl rand -base64 64)'
#
#   kubectl create secret generic registry-secret \
#     --type=kubernetes.io/dockerconfigjson \
#     --from-file=.dockerconfigjson=$HOME/.docker/config.json
#
# NIEMALS echte Passwörter in diese Datei schreiben!
---
apiVersion: v1
kind: Secret
metadata:
  name: medusa-secrets
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: "CHANGE_ME"
  REDIS_URL: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
  COOKIE_SECRET: "CHANGE_ME"
