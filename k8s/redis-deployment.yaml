# Redis ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: default
data:
  redis.conf: |
    # Redis Konfiguration für Medusa
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    
    # Persistenz (disabled for emptyDir - enable when using PVC)
    # save 900 1
    # save 300 10
    # save 60 10000
    appendonly no
    
    # Datenbanken (0 = dev, 1 = prod)
    databases 16
    
    # Logging
    loglevel notice
    
    # Netzwerk
    bind 0.0.0.0
    protected-mode yes
    port 6379

    # Authentifizierung (Passwort aus K8s Secret setzen)
    # requirepass wird via --requirepass CLI-Flag gesetzt
    
    # Performance
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: default
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
          - redis-server
          - /etc/redis/redis.conf
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-config
          mountPath: /etc/redis
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      # Using emptyDir for development (data not persisted across pod restarts)
      # For production, use a PVC with a proper StorageClass
      - name: redis-data
        emptyDir: {}
      - name: redis-config
        configMap:
          name: redis-config
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis
